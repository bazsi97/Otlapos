<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d3b2c">
  <title>Öt lapos römi</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%83%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="langBtn" class="chip" type="button" aria-label="Language">HU</button>
  <div id="conn" class="conn hidden" data-i18n="reconnecting"></div>

  <!-- ===== Lobby ===== -->
  <section id="screen-lobby" class="screen center">
    <div class="panel lobby">
      <h1>Öt lapos römi</h1>
      <p class="sub" data-i18n="subtitle"></p>
      <label><span data-i18n="yourName"></span>
        <input id="nameInput" maxlength="20" autocomplete="nickname">
      </label>
      <button id="createBtn" class="primary" data-i18n="create"></button>
      <label class="check"><input id="strictInput" type="checkbox" checked> <span data-i18n="strict"></span></label>
      <div class="or" data-i18n="or"></div>
      <div class="row">
        <input id="codeInput" maxlength="4" placeholder="ABCD" autocapitalize="characters" autocomplete="off" spellcheck="false">
        <button id="joinBtn" data-i18n="join"></button>
      </div>
      <p id="lobbyErr" class="err"></p>
    </div>
  </section>

  <!-- ===== Waiting room ===== -->
  <section id="screen-wait" class="screen center hidden">
    <div class="panel lobby">
      <h2 data-i18n="waitTitle"></h2>
      <p data-i18n="waitHelp"></p>
      <div id="waitCode" class="bigcode"></div>
      <div class="row">
        <input id="shareLink" readonly>
        <button id="copyBtn" data-i18n="copy"></button>
      </div>
      <button id="leaveWaitBtn" class="ghost" data-i18n="leave"></button>
    </div>
  </section>

  <!-- ===== Game ===== -->
  <section id="screen-game" class="screen hidden">
    <header id="topbar">
      <div class="brand">Öt lapos römi <span id="roomCode" class="code"></span></div>
      <div id="score" class="score"></div>
      <button id="langBtn2" class="chip" type="button" aria-label="Language">HU</button>
      <button id="leaveBtn" class="chip" data-i18n="leave"></button>
    </header>

    <div id="opp" class="oppbar">
      <div class="who"><span id="oppDot" class="dot"></span><b id="oppName"></b><span id="oppOpened" class="badge"></span></div>
      <div id="oppCards" class="backs"></div>
      <div id="oppInfo" class="info"></div>
    </div>

    <main id="boardWrap"><div id="board"></div></main>

    <footer id="dock">
      <div id="status" class="status"></div>
      <div class="dockrow">
        <div id="hand" class="hand" data-drop="hand"></div>
        <div class="actions">
          <button id="doneBtn" class="primary" data-i18n="done"></button>
          <button id="drawBtn" data-i18n="draw"></button>
          <button id="resetBtn" class="ghost" data-i18n="reset"></button>
          <button id="sortBtn" class="ghost"></button>
        </div>
      </div>
    </footer>

    <div id="overlay" class="overlay hidden">
      <div class="panel">
        <h2 id="overlayTitle"></h2>
        <p id="overlaySub"></p>
        <button id="rematchBtn" class="primary" data-i18n="rematch"></button>
        <button id="overlayCloseBtn" class="ghost" data-i18n="viewTable"></button>
      </div>
    </div>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
